spring:
  application:
    name: upload-event-consumer
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    
  jackson:
    default-property-inclusion: non_null
  
  security:
    enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.uploadeventconsumer: DEBUG
    org.springframework.amqp: INFO
