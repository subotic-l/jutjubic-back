# Nginx Load Balancer konfiguracija za Jutjubic klaster
#
# FUNKCIONALNOST:
# ===============
# 1. Round-robin load balancing između app-1 i app-2
# 2. Health check svake replike na /actuator/health
# 3. Automatsko uklanjanje nezdravih replika iz pool-a
# 4. Sticky sessions nisu potrebne - aplikacija je stateless
#
# DETEKCIJA PADA REPLIKE:
# ========================
# - Nginx proverava health svake replike svakih 10 sekundi
# - Ako replika ne odgovori ili vrati non-200 status, označava se kao DOWN
# - max_fails=2: Nakon 2 neuspela pokušaja, replika se izbacuje
# - fail_timeout=30s: Replika ostaje van pool-a 30s, zatim se ponovo testira
# - Ako se replika oporavi, automatski se vraća u pool
#
# TESTIRANJE:
# ===========
# 1. Ugasite app-1: docker stop jutjubic-app-1
#    - Zahtevi se rutiraju samo na app-2
#    - curl http://localhost/api/cluster/info pokazuje samo app-2
#
# 2. Podignite app-1: docker start jutjubic-app-1
#    - Nakon ~30-40s (health check + start_period) app-1 se vraća u pool
#    - curl više puta pokazuje naizmenično app-1 i app-2

events {
    worker_connections 1024;
}

http {
    # Upstream grupa sa backend replikama
    upstream jutjubic_backend {
        # Round-robin load balancing (default)
        # Svaki zahtev ide na sledeću repliku u nizu
        
        # Replika 1
        server app-1:8080 max_fails=1 fail_timeout=10s;
        
        # Replika 2
        server app-2:8080 max_fails=1 fail_timeout=10s;
        
        # max_fails=1: Nakon 1 neuspelog pokušaja, replika se smatra DOWN
        # fail_timeout=10s: Replika ostaje van pool-a 10 sekundi, zatim se testira ponovo
        
        # Napomena: Nginx Open Source nema native health check
        # Umesto toga koristi passive health checking kroz stvarne zahteve
        # Za active health checking, potreban je Nginx Plus ili custom skripta
    }

    # Log format sa informacijama o upstreamu
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr upstream_status: $upstream_status '
                            'upstream_response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;
    error_log /var/log/nginx/error.log warn;

    # Server blok
    server {
        listen 80;
        server_name localhost;

        # Proxy timeout settings (default za sve lokacije)
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Automatski prebaci zahtev na drugu repliku ako trenutna ne radi
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        
        # File upload settings
        client_max_body_size 210M;
        client_body_buffer_size 128k;

        # Nginx health check endpoint (provera samog nginx-a)
        location /health {
            access_log off;
            return 200 "nginx is healthy\n";
            add_header Content-Type text/plain;
        }

        # Health check endpoint za backend replike
        # Ovo se koristi za proveru zdravlja celog sistema
        location /actuator/health {
            proxy_pass http://jutjubic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Duzi timeout za health check (RabbitMQ connection moze biti spor)
            proxy_connect_timeout 20s;
            proxy_read_timeout 20s;
        }

        # Svi API zahtevi se rutiraju na backend replike
        location /api/ {
            proxy_pass http://jutjubic_backend;

            # Osnovni proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Povecani timeouts za operacije (posebno CREATE koje mogu biti spore)
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            
            # File upload support
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 210M;

            # Failover settings - NE prebacuj na drugu repliku za POST/PUT zahteve
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }


        # Actuator endpoints (metrics, prometheus, itd.)
        location /actuator/ {
            proxy_pass http://jutjubic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static fajlovi (ako postoje)
        location /uploads/ {
            # Uploads folder je share-ovan između replika
            alias /app/uploads/;
        }

        # WebSocket endpoint za chat (staro - može se obrisati ako se ne koristi)
        location /ws {
            proxy_pass http://jutjubic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specifično
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket endpoint za SockJS chat
        location /ws-chat {
            proxy_pass http://jutjubic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket specifično - SockJS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Default location
        location / {
            proxy_pass http://jutjubic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
